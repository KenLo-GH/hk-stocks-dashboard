[project]
name = "hk-stocks-dashboard"
version = "1.0.0"
description = "HKEX stock dashboard: FastAPI (Vercel) + stdlib server. Data: Yahoo Finance (primary), EastMoney (read-only fallback)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

# Vercel Python runtime: installs the dependencies above from this file and
# auto-detects the FastAPI `app` instance in app.py (module-level `app`).
# https://vercel.com/docs/frameworks/backend/fastapi
[tool.vercel]
python-version = "3.12"
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
